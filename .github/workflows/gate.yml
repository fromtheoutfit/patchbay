# The verification gate in CI: the same scripts/gate.sh, and nothing else. One job, on every pull
# request and every push to main; no linter, formatter or check lives here. Rule:
# agent-os/standards/base/process/verification-gate.md, "CI". Each action is pinned to a commit,
# its tag beside it. No runner is installed: no gate step assumes one yet; the toolchain spec adds
# astral-sh/setup-uv, pinned, when a step first runs a tool through uvx. A pin is bumped
# deliberately, in the gate's own spec. Caching is off (nothing to key it on), neither checkout
# keeps a token, and the job times out well above its usual minute.
#
# Layout, per agent-os/standards/base/process/standards-sync.md: actions/checkout writes nowhere
# but the workspace, so this repository is checked out into patchbay/ and patchbay-standards
# beside it, at the commit pinned in agent-os/standards/base/.version, which the pin step reads
# and passes as that checkout's ref; the gate runs from patchbay/.
name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: patchbay
          persist-credentials: false
      - id: pin
        run: echo "sha=$(tr -d '[:space:]' < patchbay/agent-os/standards/base/.version)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: fromtheoutfit/patchbay-standards
          ref: ${{ steps.pin.outputs.sha }}
          path: patchbay-standards
          persist-credentials: false
      - run: scripts/gate.sh
        working-directory: patchbay
