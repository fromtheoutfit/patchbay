[project]
name = "patchbay-core"
version = "0.1.0"
description = "Headless control of software instruments from Python: the contracts, host and CLI that patchbay-<instrument> adapters plug into."
readme = "README.md"
authors = [
    { name = "Michael Witwicki", email = "michael@theout.fit" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "patchbay"
